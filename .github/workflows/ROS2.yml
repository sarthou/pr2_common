name: ROS2 CI

on:
  push:
    branches:
      - ros2
  pull_request:
    branches:
      - ros2

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        include:
          - operating-system: ubuntu-22.04
            ros_distro: humble
          - operating-system: ubuntu-22.04
            ros_distro: iron
          - operating-system: ubuntu-24.04
            ros_distro: jazzy
    env:
      CI_SOURCE_PATH: $(pwd)
      ROS_DISTRO: ${{ matrix.ros_distro }}
    steps:
      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install deps
        run: |
            sudo apt install -y liburdfdom-dev
            sudo apt install ros-$ROS_DISTRO-std-msgs
            source /opt/ros/$ROS_DISTRO/setup.bash

      - name: Setup Workspace
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          cd $GITHUB_WORKSPACE
          mkdir -p ros2_ws/src/pr2_common
          cd ros2_ws/src
          git clone -b ros2 https://github.com/jdlangs/ivcon.git
          git clone -b ros2 https://github.com/jdlangs/convex_decomposition.git
          cd ros2_ws
          colcon build --symlink-install

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/pr2_common

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/ros2_ws
          source install/setup.bash
          export ROS_LOCALHOST_ONLY=1
          colcon build --symlink-install
          colcon test